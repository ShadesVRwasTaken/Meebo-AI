<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meebo Offline AI</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #chat-container { width: 420px; height: 580px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        #chat-header { background: #E91E63; color: white; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; }
        #status-bar { background: #fff3f8; padding: 8px 15px; font-size: 0.85rem; border-bottom: 1px solid #ffe3ee; color: #c2185b; text-align: center; }
        #progress-container { width: 100%; background-color: #f3f3f3; border-radius: 4px; height: 8px; margin-top: 5px; display: none; }
        #progress-bar { width: 0%; height: 100%; background-color: #E91E63; border-radius: 4px; transition: width 0.2s ease; }
        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 14px; border-radius: 8px; max-width: 75%; font-size: 0.95rem; line-height: 1.4; }
        .user { background: #E91E63; color: white; align-self: flex-end; }
        .ai { background: #e9ecef; color: #333; align-self: flex-start; }
        #input-area { display: flex; border-top: 1px solid #ddd; background: #fff; }
        #user-input { flex: 1; padding: 15px; border: none; outline: none; font-size: 0.95rem; }
        #send-btn { padding: 15px 20px; background: #E91E63; color: white; border: none; cursor: pointer; font-weight: bold; }
        #send-btn:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="chat-header">🤖 Meebo (Offline)</div>
    <div id="status-bar">
        <span id="status-text">Waking up Meebo...</span>
        <div id="progress-container"><div id="progress-bar"></div></div>
    </div>
    <div id="messages"></div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Loading AI model, please wait..." disabled>
        <button id="send-btn" disabled>Send</button>
    </div>
</div>

<!-- Import WebLLM via ESM module in the app script -->
<script type="module" src="app.js"></script>
</body>
</html>
