<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meebo AI Chatbot</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #chat-container { width: 400px; height: 550px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        #chat-header { background: #4CAF50; color: white; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; }
        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 14px; border-radius: 8px; max-width: 75%; font-size: 0.95rem; line-height: 1.4; }
        .user { background: #4CAF50; color: white; align-self: flex-end; }
        .ai { background: #e9ecef; color: #333; align-self: flex-start; }
        #input-area { display: flex; border-top: 1px solid #ddd; background: #fff; }
        #user-input { flex: 1; padding: 15px; border: none; outline: none; font-size: 0.95rem; }
        #send-btn { padding: 15px 20px; background: #4CAF50; color: white; border: none; cursor: pointer; font-weight: bold; }
        #send-btn:hover { background: #43a047; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="chat-header">🤖 Meebo AI</div>
    <div id="messages"></div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Say hi to Meebo...">
        <button id="send-btn">Send</button>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
